# Parley — the one gate, hosted.
#
# This workflow runs `scripts/verify-sprint.sh` and NOTHING ELSE. It observes
# the loop; it never participates in it: no `wrap-sprint.sh`, no edit to
# `.parley/scope`, no commit, no push, no `--reset`.
#
# WHY `--phase green` IS PASSED EXPLICITLY, AND MUST STAY THAT WAY.
# `verify-sprint.sh` resolves the TDD phase from the `phase:` line of
# `.parley/scope` unless an explicit `--phase` wins (script lines 57-70). During
# a RED phase that file reads `phase: red`, and the red gate REQUIRES the suite
# to fail. A workflow that let the script read the file would therefore report
# failure for the whole of every red phase — days at a time, on `main` — and the
# badge would be measuring the sprint's TDD state instead of the health of the
# committed tree. The red gate is a local, human-reviewed gate; what CI checks is
# the invariant that holds at every commit: the committed suite passes.
#
# The host can advance independently of the tested GNU Smalltalk baseline.
# The image digest pins the initial userspace; the dated Ubuntu archive pins
# the packages installed into it. Refresh both deliberately and verify both
# seeds. Jammy preserves the tested toolchain, not indefinite OS support.
# This is roadmap §6 item 1: the ubuntu-22.04 runner retires in April 2027.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint guardrails + axiomatic SUnit suite
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false

      # Build here instead of requiring a separately published GHCR image.
      # The official Jammy curl base includes CA certificates: the Ubuntu
      # snapshot service requires HTTPS, which a bare Ubuntu image cannot
      # validate until certificates have been installed.
      # gnu-smalltalk-common is a Recommends, so name it explicitly for SUnit.
      # The test user matches the checkout owner. Root would bypass the
      # permission fixtures and invalidate the unreadable/unwritable laws.
      - name: Build the pinned GNU Smalltalk 3.2.5 environment
        run: |
          docker build --tag parley-ci:gst-3.2.5 \
            --build-arg PARLEY_UID="$(id -u)" \
            --build-arg PARLEY_GID="$(id -g)" - <<'DOCKERFILE'
          FROM buildpack-deps:jammy-curl@sha256:10ffecf0416e47f8ed9a621ce234b209b69c3d1e7e79ba273394ef6ff74b4f5b
          RUN printf '%s\n' \
                'deb https://snapshot.ubuntu.com/ubuntu/20261101T000000Z jammy main universe' \
                'deb https://snapshot.ubuntu.com/ubuntu/20261101T000000Z jammy-updates main universe' \
                'deb https://snapshot.ubuntu.com/ubuntu/20261101T000000Z jammy-security main universe' \
                > /etc/apt/sources.list \
              && apt-get -o APT::Update::Error-Mode=any update \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                gnu-smalltalk=3.2.5-1.3ubuntu1 \
                gnu-smalltalk-common=3.2.5-1.3ubuntu1 \
                libgst7=3.2.5-1.3ubuntu1 git curl zip unzip ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          ARG PARLEY_UID
          ARG PARLEY_GID
          RUN test "$PARLEY_UID" -ne 0 \
              && groupadd --gid "$PARLEY_GID" parley \
              && useradd --uid "$PARLEY_UID" --gid "$PARLEY_GID" \
                --create-home --shell /bin/bash parley
          USER parley
          WORKDIR /workspace
          DOCKERFILE

      # A silently different toolchain would make every later green a lie, so
      # this fails loudly rather than proceeding. gst-package is checked
      # separately: it is a distinct binary and the publish/install suites are
      # useless without it.
      - name: Assert the toolchain is the 3.2.5 baseline
        run: |
          docker run --rm --network none -i parley-ci:gst-3.2.5 bash -euo pipefail <<'PROBE'
            test "$(id -u)" -ne 0
            gst --version
            gst --version | grep -Fx 'GNU Smalltalk version 3.2.5'
            command -v gst-package
            # gst can return 0 after an error; require SUnit's success marker.
            printf "PackageLoader fileInPackage: 'SUnit'.\nTranscript showCr: 'SUNIT-OK'.\n" > /tmp/sunit-probe.st
            gst -q /tmp/sunit-probe.st 2>&1 | grep -Fx 'SUNIT-OK'
          PROBE

      # The default seed, which is the one every sprint's audit record cites.
      - name: Verify (default seed)
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            parley-ci:gst-3.2.5 ./scripts/verify-sprint.sh --phase green

      # A suite that only ever runs one seed is not a randomized suite. This is
      # a SEPARATE step so a seed-dependent failure is distinguishable at a
      # glance from a deterministic one, and it is NOT continue-on-error: a law
      # that holds at 20260718 and fails at 42 is a real defect.
      - name: Verify (second seed — the randomized suites are not seed-shaped)
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            parley-ci:gst-3.2.5 ./scripts/verify-sprint.sh --phase green --seed 42
